<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación Estrella / Cometa</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
        }
        canvas {
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <canvas id="myCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        // Variables de posición
        let xPos = 200;
        let yPos = 200;

        function draw() {
            // Fondo de azul oscuro: background(29, 40, 115)
            ctx.fillStyle = "rgb(29, 40, 115)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar la línea (cola de la estrella): stroke(255, 255, 255), strokeWeight(2)
            ctx.strokeStyle = "rgb(255, 255, 255)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(xPos - 20, yPos - 20);
            ctx.lineTo(xPos, yPos);
            ctx.stroke();

            // Dibujar la cabeza (círculo amarillo): fill(255, 242, 0), noStroke()
            ctx.fillStyle = "rgb(255, 242, 0)";
            ctx.beginPath();
            // 5 es el radio (mitad del diámetro de 10)
            ctx.arc(xPos, yPos, 5, 0, Math.PI * 2);
            ctx.fill();

            // Actualizar posiciones
            xPos += 3;
            yPos += 2;

            // Reiniciar posición si se sale del marco (400x400)
            if (xPos > 400 || yPos > 400) {
                xPos = 0;
                yPos = 0;
            }
        }

        // Bucle de animación (~60 FPS)
        setInterval(draw, 1000 / 60);
    </script>

</body>
</html>
